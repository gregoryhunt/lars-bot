name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lars
          POSTGRES_PASSWORD: lars
          POSTGRES_DB: lars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lars"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Point the integration test harness at the Postgres service.
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5432"
      TEST_PG_USER: lars
      TEST_PG_PASSWORD: lars
      TEST_PG_DB: lars_test

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ty (type check)
        run: uv run ty check

      - name: Pytest
        run: uv run pytest -q
