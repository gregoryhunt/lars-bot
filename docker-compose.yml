services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lars
      POSTGRES_PASSWORD: lars
      POSTGRES_DB: lars
    ports:
      # Host 5433 to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - lars_pgdata:/var/lib/postgresql/data

volumes:
  lars_pgdata:
